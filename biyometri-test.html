<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>Parola Kasam – Biyometri testi</title><style>body{font:17px system-ui;background:#eef2f7;color:#152840;margin:20px}main{max-width:600px;margin:auto;background:white;padding:22px;border-radius:16px}button{font:inherit;background:#176b75;color:white;border:0;padding:14px;border-radius:9px;width:100%;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#176b75}</style><main><h1>Biyometrik giriş testi</h1><p>Bu test gerçek kasanı veya parolanı kullanmaz. Telefonunda yalnızca geçici bir test kimlik bilgisi oluşturur. Test sonrasında cihazının geçiş anahtarları ayarından “Parola Kasam Test” kaydını silebilirsin.</p><button id="check">Cihaz uyumluluğunu kontrol et</button><button id="create">1. Test geçiş anahtarı oluştur</button><button id="verify">2. Biyometrik doğrulamayı test et</button><pre id="out" aria-live="polite"></pre><a href="./index.html">Kasaya dön</a></main><script>const out=document.getElementById('out'),rand=n=>crypto.getRandomValues(new Uint8Array(n));let id,first;const salt=rand(32);function log(s){out.textContent+=s+'\n'}function err(e){log('Hata: '+e.name+' — '+e.message)}document.getElementById('check').onclick=async()=>{out.textContent='';log('HTTPS: '+isSecureContext);log('WebAuthn: '+!!window.PublicKeyCredential);try{log('Cihaz doğrulayıcısı: '+await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){err(e)}};document.getElementById('create').onclick=async()=>{try{const c=await navigator.credentials.create({publicKey:{challenge:rand(32),rp:{name:'Parola Kasam Test'},user:{id:rand(32),name:'parola-kasam-test-'+Date.now(),displayName:'Parola Kasam Test'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},timeout:60000,attestation:'none',extensions:{prf:{eval:{first:salt}}}}});id=c.rawId;const p=c.getClientExtensionResults().prf;first=p?.results?.first;log('Test kimlik bilgisi oluşturuldu. PRF desteği: '+(p?.enabled===true||!!first));log('Şimdi 2. düğmeye bas.')}catch(e){err(e)}};document.getElementById('verify').onclick=async()=>{if(!id){log('Önce test geçiş anahtarı oluştur.');return}try{const a=await navigator.credentials.get({publicKey:{challenge:rand(32),allowCredentials:[{type:'public-key',id,transports:['internal']}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});const v=a.getClientExtensionResults().prf?.results?.first;log('Cihaz doğrulama işlemi döndü.');log('PRF anahtar çıktısı: '+(v?.byteLength===32?'32 bayt — destekleniyor':'yok'));if(v){if(first){const same=new Uint8Array(v).every((x,i)=>x===new Uint8Array(first)[i]);log('Aynı anahtar çıktısı: '+same)}else{first=v;log('Tekrarlanabilirliği kontrol etmek için 2. düğmeye tekrar bas.')}}log('Not: Bu test Face ID ile cihaz PIN yöntemini ayırt edemez; telefondaki doğrulama ekranına bak. Kasa açma henüz uygulanmadı.')}catch(e){err(e)}};</script></html>
